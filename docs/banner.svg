<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15161C"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#D4530A"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFC49A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8630A"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="215" cy="30" r="150" fill="#E8630A" opacity="0.22" filter="url(#soft)"/>
  <circle cx="1010" cy="330" r="175" fill="#4A6BD8" opacity="0.18" filter="url(#soft)"/>

  <!-- icon: film frame with a play mark -->
  <g transform="translate(84,92)">
    <rect width="132" height="132" rx="30" fill="url(#iconGrad)"/>
    <g fill="#FFFFFF" fill-opacity="0.92">
      <rect x="16" y="26" width="13" height="15" rx="4"/>
      <rect x="16" y="58" width="13" height="15" rx="4"/>
      <rect x="16" y="90" width="13" height="15" rx="4"/>
      <rect x="103" y="26" width="13" height="15" rx="4"/>
      <rect x="103" y="58" width="13" height="15" rx="4"/>
      <rect x="103" y="90" width="13" height="15" rx="4"/>
    </g>
    <rect x="38" y="26" width="56" height="80" rx="10" fill="#FFFFFF" fill-opacity="0.16"/>
    <path d="M56 48 L82 66 L56 84 Z" fill="#FFFFFF"/>
  </g>

  <!-- wordmark -->
  <text x="250" y="158" font-size="80" font-weight="800" letter-spacing="-3" fill="url(#word)">ffmpeg-mcp</text>
  <text x="253" y="198" font-size="21" font-weight="500" fill="#9AA0AB">Give any MCP client a full video editor.</text>

  <!-- capability pills -->
  <g transform="translate(253,222)" font-size="13" font-weight="600">
    <g>
      <rect width="86" height="28" rx="14" fill="#E8630A" fill-opacity="0.16" stroke="#E8630A" stroke-opacity="0.45"/>
      <text x="43" y="19" fill="#FFA469" text-anchor="middle">ffmpeg</text>
    </g>
    <g transform="translate(96,0)">
      <rect width="86" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="43" y="19" fill="#C3C8D2" text-anchor="middle">Whisper</text>
    </g>
    <g transform="translate(192,0)">
      <rect width="100" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="50" y="19" fill="#C3C8D2" text-anchor="middle">MediaPipe</text>
    </g>
    <g transform="translate(302,0)">
      <rect width="112" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="56" y="19" fill="#C3C8D2" text-anchor="middle">32 MCP tools</text>
    </g>
  </g>

  <!-- mini job queue, echoing the real UI -->
  <g transform="translate(742,80)">
    <rect width="374" height="180" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>

    <g transform="translate(20,24)" font-size="12.5">
      <text x="0" y="0" font-weight="700" fill="#E7E9EE">auto_caption</text>
      <rect x="104" y="-11" width="46" height="17" rx="8.5" fill="#3FB87A" fill-opacity="0.16"/>
      <text x="127" y="1" font-size="10.5" font-weight="700" fill="#4ECB8B" text-anchor="middle">done</text>
      <rect x="0" y="12" width="334" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="0" y="12" width="334" height="5" rx="2.5" fill="#3FB87A"/>
    </g>

    <g transform="translate(20,84)" font-size="12.5">
      <text x="0" y="0" font-weight="700" fill="#E7E9EE">track_and_crop</text>
      <rect x="118" y="-11" width="60" height="17" rx="8.5" fill="#E8630A" fill-opacity="0.18"/>
      <text x="148" y="1" font-size="10.5" font-weight="700" fill="#FFA469" text-anchor="middle">running</text>
      <rect x="0" y="12" width="334" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="0" y="12" width="214" height="5" rx="2.5" fill="url(#bar)"/>
      <text x="334" y="34" font-size="11" fill="#6E727D" text-anchor="end">64%</text>
    </g>

    <g transform="translate(20,144)" font-size="12.5">
      <text x="0" y="0" font-weight="700" fill="#9AA0AB">render_timeline</text>
      <rect x="124" y="-11" width="56" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.07"/>
      <text x="152" y="1" font-size="10.5" font-weight="700" fill="#9AA0AB" text-anchor="middle">queued</text>
    </g>
  </g>
</svg>
